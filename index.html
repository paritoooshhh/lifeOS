<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LifeOS"><meta name="description" content="Your private personal life operating system"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>LifeOS Midnight · Your life, in balance</title></head><body><div id="authGate" class="auth-gate"><div class="auth-card"><div class="brandmark">◈</div><h1>LifeOS</h1><p id="authStatus">Connecting securely…</p><div id="clerkSignIn"></div><button id="authRetry" class="secondary" hidden>Retry</button></div></div><div id="app" hidden><header class="top"><div class="brand"><span class="brandmark">◈</span><div><strong>LifeOS</strong><small>Your life, in balance</small></div></div><div class="topright"><button id="account" class="iconbtn" aria-label="Account">♙</button><button id="theme" class="iconbtn" aria-label="Toggle theme">☾</button><button id="sharedNav" class="iconbtn" aria-label="Shared spaces" title="Shared spaces" hidden>♧</button><button id="settings" class="iconbtn" aria-label="Data settings">⚙</button></div></header><main id="main"></main><nav id="nav" class="bottom" aria-label="Primary navigation"><button data-tab="home" class="active"><span>⌂</span>Today</button><button data-tab="planner"><span>▦</span>Plan</button><button data-tab="log"><span>＋</span>Log</button><button data-tab="track"><span>◫</span>Track</button><button data-tab="ai"><span>✦</span>AI</button><button data-tab="review"><span>◷</span>Review</button></nav></div><dialog id="modal"><form id="entryForm" method="dialog"><div class="modalhead"><h2 id="modalTitle">Add entry</h2><button type="button" id="closeModal" class="iconbtn">✕</button></div><div id="fields"></div><div class="actions"><button type="button" id="deleteEntry" class="danger" hidden>Delete</button><button type="submit" class="primary">Save entry</button></div></form></dialog><dialog id="timingReview" class="timing-review"><form id="trForm"><div class="modalhead"><h2 id="trHeading">Record activity</h2><button id="trCancel" type="button" class="iconbtn" aria-label="Close">✕</button></div><p class="sub" id="trExplanation"></p><div class="formgrid"><div class="field"><label for="trStartDate">Actual start date</label><input id="trStartDate" type="date" required></div><div class="field"><label for="trStart">Actual start time</label><input id="trStart" type="time" required></div><div class="field"><label for="trEndDate">Actual end date</label><input id="trEndDate" type="date" required></div><div class="field"><label for="trEnd">Actual end time</label><input id="trEnd" type="time" required></div></div><div id="trShortcuts" class="tr-shortcuts"><div class="field"><label for="trDirection">Adjust scheduled finish</label><select id="trDirection"><option value="early">Earlier</option><option value="late">Later</option></select></div><div class="tr-chips"><button type="button" class="secondary small" data-tr-offset="5">5m</button><button type="button" class="secondary small" data-tr-offset="10">10m</button><button type="button" class="secondary small" data-tr-offset="15">15m</button><button type="button" class="secondary small" data-tr-offset="20">20m</button><button type="button" class="secondary small" data-tr-offset="25">25m</button><button type="button" class="secondary small" data-tr-offset="30">30m</button><button type="button" class="secondary small" data-tr-offset="45">45m</button><button type="button" class="secondary small" data-tr-offset="50">50m</button></div></div><div class="tr-chips tr-adjust"><span class="sub">Fine-tune end time</span><button type="button" class="secondary small" data-tr-step="-5">−5m</button><button type="button" class="secondary small" data-tr-step="-1">−1m</button><button type="button" class="secondary small" data-tr-step="1">+1m</button><button type="button" class="secondary small" data-tr-step="5">+5m</button></div><p class="notice" aria-live="polite">Recorded duration: <strong id="trDuration">—</strong></p><div id="trReplacement" hidden><div class="field"><label for="trTitle">What did you do instead?</label><input id="trTitle" type="text" maxlength="150" placeholder="e.g. Studied Verilog"></div><div class="field"><label for="trCategory">Category</label><select id="trCategory"></select></div></div><div class="actions"><button id="trSkipOnly" type="button" class="secondary" hidden>Skip without logging</button><button id="trSave" type="submit" class="primary">Save</button></div></form></dialog><input id="sharedImportFile" type="file" accept="application/json,.json" hidden><input id="importFile" type="file" accept="application/json,.json" hidden><script src="config.js"></script><script src="lifeos-time.js"></script><script src="auth.js" defer></script></body></html>
